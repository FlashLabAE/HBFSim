# Boundary-temperature sweep point: 70 C local package boundary
# (45 C coolant-supply reference + 25 C declared neighbor cross-heating),
# a full-load GPU package neighborhood assumption. Sustains ~86 GB/s of
# reads per stack in the reference parameterization (5.5 W light budget at
# 8 pJ/bit). Boundaries at or above 76 C fail closed BY POLICY (the idle
# steady state, boundary + 2 W x 2.0 C/W, would sit at or above RTT, so the
# governor could never release and permanent throttling must be an explicit
# decision), not as a physical operating limit: 76-80 C boundaries retain a
# positive pacing budget. Apply after a complete topology profile. Declares
# the neighbors instead of modeling them: it does not combine with
# package-coupling-liquid-cooled, which derives the boundary from the GPU and
# HBM stacks and refuses a declared neighbor heat.
hbf-thermal-neighbor-heat-c=25
