# Boundary-temperature sweep point: 55 C local package boundary
# (45 C coolant-supply reference + 10 C declared neighbor cross-heating).
# Sustains ~203 GB/s of reads per stack in the reference parameterization
# (13 W light budget at 8 pJ/bit), numerically bracketing the ~202 GB/s of
# arXiv 2608.11668, whose physical conditions (write-heavy KV, 80 C safe
# junction, ~54 W 3D-ICE projection) differ from this pure-read model; the
# temperature point is not sourced from that paper. Apply after a complete
# topology profile. Declares the neighbors instead of modeling them: it does
# not combine with package-coupling-liquid-cooled, which derives the boundary
# from the GPU and HBM stacks and refuses a declared neighbor heat.
hbf-thermal-neighbor-heat-c=10
