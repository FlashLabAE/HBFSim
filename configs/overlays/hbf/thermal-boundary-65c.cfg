# Boundary-temperature sweep point: 65 C local package boundary
# (45 C coolant-supply reference + 20 C declared neighbor cross-heating).
# 65 C is the NVL72-class maximum liquid RETURN temperature; mapping a
# coolant-loop envelope onto the HBF RC-node boundary is a model
# assumption, not an HBF measurement. Sustains ~125 GB/s of reads per stack
# in the reference parameterization (8 W light budget at 8 pJ/bit). Apply
# after a complete topology profile. Declares the neighbors instead of
# modeling them: it does not combine with package-coupling-liquid-cooled,
# which derives the boundary from the GPU and HBM stacks and refuses a
# declared neighbor heat.
hbf-thermal-neighbor-heat-c=20
