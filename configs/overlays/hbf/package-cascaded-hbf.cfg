# FlashAccel's cascaded integration on top of package-coupling-liquid-cooled:
# every HBF stack hangs behind an HBM base die, so each byte it reads or
# programs also crosses that HBM stack's PHY and deposits about 0.5 pJ/bit
# there (UCIe advanced-package link energy, ISSCC 2025). Apply after
# package-coupling-liquid-cooled.
package-hbf-topology=cascaded
package-hbm-passthrough-energy-pj-per-bit=0.5
