# page-mshr: frontend candidate v1; nominal assumptions, open-loop admission.
# System geometry, HBM buffer sizes and media timings are inherited.
hbf-mapping-compute-workers=64
hbf-read-buffer-coalescing=true
hbf-read-mshr-entries-per-stack=auto
hbf-read-mshr-targets-per-entry=64
hbf-read-mshr-check-ns=0.125
hbf-read-mshr-admission-timed=true
hbf-ingress-buffer-tags=false
hbf-write-buffer-shared-hbm=true
