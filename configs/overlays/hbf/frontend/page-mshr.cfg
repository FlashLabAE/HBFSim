# page-mshr: frontend v1; nominal host policy, open-loop admission.
# System geometry, HBM buffer sizes and media timings are inherited.
hbf-mapping-compute-workers=64
hbf-read-buffer-coalescing=true
hbf-read-mshr-entries-per-stack=auto
hbf-read-mshr-targets-per-entry=64
# OCP HBF v0.7.0 sections 4.3 and 5.1, speed grade 2:
# independent channels; one ~2 GHz AXI interface accepts one read address/cycle.
# 0.5 ns/channel / 16 channels = 0.03125 ns equivalent stack service interval.
# Retains one stack resource; per-channel modeling differs for unbalanced loads.
hbf-read-mshr-check-ns=0.03125
hbf-read-mshr-admission-timed=true
hbf-ingress-buffer-tags=false
hbf-write-buffer-shared-hbm=true
