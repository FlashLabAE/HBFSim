# Package thermal network of a liquid-cooled accelerator: a 700 W GPU die
# behind 0.05 C/W to 45 C water, the HBM and HBF stacks coupled to it and
# to each other through the shared lid and interposer (complete pairing
# within each class), updated every millisecond of simulated time. The
# conductances are first-order lid-spreading estimates, not package
# measurements; docs/reference/thermal-parameters.md gives the derivation
# and the ranges to sweep. Requires hbf-thermal-enable or hbm-thermal-enable.
package-thermal-enable=true
package-thermal-ambient-c=45
package-thermal-update-interval-ns=1000000
package-gpu-power-w=700
package-gpu-resistance-c-per-w=0.05
package-gpu-capacitance-j-per-c=20
package-coupling-hbf-hbm-w-per-c=0.1
package-coupling-hbf-gpu-w-per-c=0.3
package-coupling-hbm-gpu-w-per-c=0.3
package-coupling-hbf-hbf-w-per-c=0.1
package-coupling-hbm-hbm-w-per-c=0.1
package-hbf-topology=beside
package-hbm-passthrough-energy-pj-per-bit=0.5
