# Sustained-serving initial-state boundary: the measured window is an
# excerpt of sustained serving, not a cold start. A serving-rate HBF stack
# dissipates more than its light budget (18 W per stack behind a 45 C
# boundary, 13 W at 55 C, 8 W at 65 C), so its thermal steady state is
# pinned at the governor ceiling. This overlay boots every HBF stack at the
# throttle ceiling with the governor already engaged; pacing then holds
# dissipated power at the budget for as long as the load persists. Without
# it a window shorter than a few time constants (R x C = 0.6 s) would heat
# the node from idle and report a cold transient that no steady-state
# deployment would see. The start state is an experiment boundary, not a
# device property: system profiles boot idle, and a thermal cold start is
# the default initial state. Under the package thermal network the ceiling
# start still pins the HBF stacks at LTT; the HBM stacks and the GPU boot at
# the steady state of the network around them.
hbf-thermal-start-state=throttle-ceiling
