# HBF mapping strategy: pure block mapping. A logical block maps to one
# physical NAND block (1 MiB = 256 pages, one 256-token KV block of one layer)
# with fixed in-block offsets, so the index holds one entry per block. In-order
# appends program the block in place; any other sub-block update copies the
# whole 1 MiB block to a fresh block (copy-on-write). Unstriped (superblock
# planes = 1): with striping over every plane a copy-on-write would copy the
# whole 1.5 GiB superblock per update, which rewrites more than the device per
# decode step and cannot be simulated in reasonable time. A read is one
# transaction per logical block of the range: the block's pages are read in
# order from its plane and hold one page-read credit for the run, so the
# per-stack credits bound outstanding block reads, not pages. Its index lives in
# the mapping's memory (HBM, or each stack's device DRAM when
# hbf-mapping-placement=device) under the same mapping budget as the page FTL
# and must fit it; common block state is reserved outside it, and the write
# buffer is in HBF device DRAM.
hbf-mapping-organization=block
