# HBF mapping strategy: BAST-style hybrid block mapping with dedicated log
# blocks, over superblocks striped across every plane of the HBF stacks.
# Appends program data blocks in place; a rewritten page goes to its block's
# log, merged (switch / partial / full) when the log is evicted. Logical blocks,
# logs and merges are whole superblocks, so in-order appends stay in place but
# any other update is logged or merged at superblock size. The index lives in
# the mapping's memory (HBM, or each stack's device DRAM when
# hbf-mapping-placement=device) under the same mapping budget as the page FTL
# and must fit it; common block state (per-block records and page validity
# bits) is reserved outside it, as for every organization, so the budget holds
# the index and the merge workspace. The write buffer is in HBF device DRAM.
# The log pool (hbf-mapping-log-blocks, reserved out of the logical capacity)
# must hold one log superblock per sequence that appends concurrently, or
# every step evicts logs with full merges. The paper comparison sets it per
# model to the model's decoding sequences (the scheduler batch: 16 for the
# 70B model, 64 for the 8B model); 8 is the standalone value.
hbf-mapping-organization=block-log
hbf-mapping-log-blocks=8
hbf-mapping-superblock-planes=all
